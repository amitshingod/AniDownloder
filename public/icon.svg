<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1322"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle glass border -->
  <rect x="2" y="2" width="508" height="508" rx="126" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Glowing orb in center -->
  <circle cx="256" cy="256" r="170" fill="url(#glowGrad)" opacity="0.85" filter="url(#neonGlow)"/>

  <!-- Glass inner card -->
  <rect x="120" y="120" width="272" height="272" rx="48" fill="#0f172a" fill-opacity="0.6" stroke="url(#specular)" stroke-width="2"/>

  <!-- Download arrow icon -->
  <g transform="translate(256, 256)">
    <!-- Down Arrow Stem -->
    <rect x="-14" y="-80" width="28" height="90" rx="14" fill="#ffffff"/>
    <!-- Arrow Head -->
    <path d="M-60 0 L0 65 L60 0 Z" fill="#ffffff" stroke-linejoin="round"/>
    <!-- Base Plate / Tray -->
    <path d="M-75 75 H75 C85 75 90 85 85 92 L75 98 C70 100 -70 100 -75 98 L-85 92 C-90 85 -85 75 -75 75 Z" fill="#60a5fa"/>
  </g>
</svg>
